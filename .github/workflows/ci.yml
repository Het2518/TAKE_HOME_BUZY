name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generate the Prisma client so imports in test files don't fail.
      # The tests use mocked Prisma calls so no real DB is needed here.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test
