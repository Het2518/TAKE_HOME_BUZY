# docker-compose.yml — just the PostgreSQL database for local development.
# The Next.js app itself runs with `npm run dev` on your machine.
#
# Usage:
#   docker compose up -d
#   Then set DATABASE_URL=postgresql://tracker:tracker@localhost:5432/tracker in .env
#   Then: npx prisma migrate dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
